<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Neon Celtic-Cyberpunk theme tokens — shared across all alerts.
   Change the look here, not per-alert, to keep everything consistent. */

:root {
  /* Core brand palette (character / UI chrome) */
  --bg-navy:        #0a0e1a;
  --panel-cream:    #ece5d3;
  --panel-cream-lo: #d9d0b8;
  --ink:            #241f1a;
  --teal:           #2fd9c9;
  --teal-glow:      #8af5e8;
  --orange:         #ff8a3d;
  --orange-glow:    #ffc08a;

  /* Environmental neon (knot border, particles, chase shapes) */
  --neon-cyan:      #39e6ff;
  --neon-magenta:   #ff2bd6;
  --neon-green:     #7cff9c;

  --font-display: 'Rajdhani', sans-serif;
  --font-body:    'Space Grotesk', sans-serif;

  --box-w: 800px;
  --box-h: 360px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  overflow: hidden;
  width: var(--box-w);
  height: var(--box-h);
  font-family: var(--font-body);
}

.alert-root {
  position: relative;
  width: var(--box-w);
  height: var(--box-h);
}

.alert-panel {
  position: absolute;
  inset: 34px;
  border-radius: 26px;
  background:
    radial-gradient(120% 140% at 20% 0%, #fffaf0 0%, var(--panel-cream) 45%, var(--panel-cream-lo) 100%);
  box-shadow: 0 0 40px rgba(47, 217, 201, 0.15) inset, 0 10px 30px rgba(0,0,0,0.45);
}

.alert-username {
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.alert-caption {
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--orange);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

.glow-teal   { filter: drop-shadow(0 0 6px var(--teal)) drop-shadow(0 0 14px var(--teal)); }
.glow-orange { filter: drop-shadow(0 0 6px var(--orange)) drop-shadow(0 0 14px var(--orange)); }

@keyframes popIn {
  0%   { opacity: 0; transform: scale(0.6) translateY(10px); }
  60%  { opacity: 1; transform: scale(1.08) translateY(0); }
  100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes fadeOut {
  to { opacity: 0; }
}

@keyframes textGlowPulse {
  0%, 100% { text-shadow: 0 0 10px currentColor, 0 0 2px currentColor; }
  50%      { text-shadow: 0 0 18px currentColor, 0 0 4px currentColor; }
}


.text-block {
    position: absolute;
    left: 350px; right: 30px; top: 50%;
    transform: translateY(-50%);
    text-align: center;
    opacity: 0;
  }
  .text-block.show { animation: popIn 480ms cubic-bezier(.2,1.4,.4,1) forwards; }
  .text-block.hide { animation: fadeOut 350ms ease forwards; }
  .alert-username { font-size: 44px; line-height: 1; color: var(--panel-cream); text-shadow: 0 0 18px rgba(236,229,211,0.45); }
  .alert-caption { font-size: 19px; margin-top: 8px; color: #ff4d4d; animation: textGlowPulse 1.6s ease-in-out infinite; }

  .mover {
    position: absolute;
    left: 0; top: 0;
    transform-origin: 50% 50%;
    will-change: transform;
    pointer-events: none;
  }
  .char-img { width: 52px; height: 80px; object-fit: contain; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6)); }

  .square-visual {
    width: 10px; height: 10px;
    border-radius: 2px;
    animation: squareSpin 1.4s linear infinite;
  }
  @keyframes squareSpin { to { transform: rotate(360deg); } }

  /* .mover (outer, JS-controlled translate/rotate) wraps .exclaim-img (inner,
     CSS-animated pulse) -- same split as squares use, so the JS transform
     and the CSS animation don't fight over the same element's transform. */
  .exclaim-img {
    width: 58px; height: 48px;
    object-fit: contain;
    animation: exclaimPulse 420ms ease-in-out infinite;
  }
  @keyframes exclaimPulse {
    0%, 100% { filter: drop-shadow(0 0 6px #ff2222) drop-shadow(0 0 16px #ff0000); transform: scale(1); }
    50%      { filter: drop-shadow(0 0 10px #ff4444) drop-shadow(0 0 26px #ff0000); transform: scale(1.08); }
  }

  .alert-root.fading img,
  .alert-root.fading .mover,
  .alert-root.fading .text-block { animation: fadeOut 350ms ease forwards; }

</style></head>

<div class="alert-root" id="root">
  <svg id="stage" width="800" height="360" viewBox="0 0 800 360" style="position:absolute;inset:0;"></svg>

  <div class="text-block show" id="textBlock">
    <div class="alert-username" id="username">Viewer</div>
    <div class="alert-caption">IS RAIDING!</div>

// Shared helper for moving elements along the knot centerline path.
// Keeps Follow/Sub/Raid from each reimplementing path-walking.

function makePathSampler(pathEl) {
  const len = pathEl.getTotalLength();
  const eps = Math.max(1, len * 0.002);
  return function sample(frac) {
    const f = ((frac % 1) + 1) % 1;
    const d = f * len;
    const p = pathEl.getPointAtLength(d);
    const p2 = pathEl.getPointAtLength((d + eps) % len);
    const angle = Math.atan2(p2.y - p.y, p2.x - p.x) * 180 / Math.PI;
    return { x: p.x, y: p.y, angle, len };
  };
}

// Positions `el` (expects transform-origin center) at path fraction `frac`,
// facing the direction of travel, with an optional squash pulse near corners.
function placeOnPath(el, sampler, frac, { scale = 1, flip = false, squash = 0, w = 0, h = 0, rotate = true } = {}) {
  const { x, y, angle } = sampler(frac);
  const faceFlip = flip ? 180 : 0;
  const sx = scale * (1 + squash);
  const sy = scale * (1 - squash * 0.6);
  const cx = x - w / 2;
  const cy = y - h / 2;
  const rot = rotate ? `rotate(${angle}deg)` : '';
  el.style.transform =
    `translate(${cx}px, ${cy}px) ${rot} scaleX(${sx}) scaleY(${sy}) rotate(${faceFlip}deg)`;
}

// Drives a requestAnimationFrame loop for `durationMs`, calling onFrame(t) each tick
// where t goes 0 -> 1 linearly across the whole duration. Returns a cancel function.
function runTimeline(durationMs, onFrame, onDone) {
  let start = null;
  let raf;
  function frame(ts) {
    if (start === null) start = ts;
    const t = Math.min((ts - start) / durationMs, 1);
    onFrame(t, ts - start);
    if (t < 1) {
      raf = requestAnimationFrame(frame);
    } else if (onDone) {
      onDone();
    }
  }
  raf = requestAnimationFrame(frame);
  return () => cancelAnimationFrame(raf);
}

// A small deterministic wobble (sum of two off-ratio sines) for "alive" motion
// on top of clean path tracking. Call with elapsed ms; returns offsets in [-1,1].
function makeJitter(seed = 1) {
  const a = 2.1 + seed * 0.37;
  const b = 1.3 + seed * 0.21;
  const pa = seed * 1.7;
  const pb = seed * 2.9;
  return function jitter(elapsedMs) {
    const s = elapsedMs / 1000;
    const nx = Math.sin(s * a + pa) * 0.6 + Math.sin(s * b * 1.9 + pb) * 0.4;
    const ny = Math.cos(s * b + pb) * 0.6 + Math.cos(s * a * 1.3 + pa) * 0.4;
    return { nx, ny };
  };
}

// Builds N trailing "ghost" ancestors of a moving element for a motion-blur trail.
// Returns an array of { el, phaseOffset, opacity } to update each frame alongside the lead.
function makeTrail(sourceEl, count, { spacingFrac = 0.015, opacityFalloff = 0.55 } = {}) {
  const parent = sourceEl.parentElement;
  const ghosts = [];
  for (let i = 1; i <= count; i++) {
    const ghost = sourceEl.cloneNode(true);
    ghost.removeAttribute('id');
    ghost.style.opacity = String(Math.pow(opacityFalloff, i));
    ghost.style.filter = (ghost.style.filter || '') + ' blur(1.5px)';
    parent.insertBefore(ghost, sourceEl);
    ghosts.push({ el: ghost, phaseOffset: -spacingFrac * i });
  }
  return ghosts;
}


const SVG_NS = 'http://www.w3.org/2000/svg';

function el(tag, attrs) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const k in attrs) node.setAttribute(k, attrs[k]);
  return node;
}

// Places the real Celtic N-knot artwork at its computed position/scale and

// (with a halo margin) — use with makePathSampler() to walk characters and
// shapes around the actual knot, not an abstract border shape.

function buildEmblem(root, svgEl, data, { glow = true, imgSrc = 'https://imndot.github.io/twitch-alerts/assets/celtic-n-knot.png' } = {}) {
  const { KNOT_CENTERLINE_D, EMBLEM_PLACEMENT } = data;
  const img = document.createElement('img');
  img.src = imgSrc;
  img.alt = '';
  img.style.position = 'absolute';
  img.style.left = `${EMBLEM_PLACEMENT.left}px`;
  img.style.top = `${EMBLEM_PLACEMENT.top}px`;
  img.style.width = `${EMBLEM_PLACEMENT.width}px`;
  img.style.height = `${EMBLEM_PLACEMENT.height}px`;
  if (glow) img.style.filter = 'drop-shadow(0 0 14px rgba(47,217,201,0.35))';
  root.appendChild(img);

  const centerline = el('path', { d: KNOT_CENTERLINE_D, fill: 'none', stroke: 'none' });
  svgEl.appendChild(centerline);
  return centerline;
}

    exclaimWrap.style.transform = `translate(${cx}px, ${cy}px) rotate(${angle}deg)`;

    const fIdx = Math.floor(elapsedMs / EXCLAIM_FRAME_MS) % EXCLAIM_FRAMES.length;
    if (fIdx !== lastExclaimFrame) {
      lastExclaimFrame = fIdx;
      exclaimEl.src = EXCLAIM_FRAMES[fIdx];
    }
  }

  const LOOP_DURATION = 3000; // ms per full lap around the knot

  function render(frac, elapsedMs) {
    placeCharacter((frac + CHAR_PHASE_LEAD) % 1, elapsedMs);
    squares.forEach(sq => {
      const { x, y, angle } = sampler((frac + sq.offset + 1) % 1);
      const { nx, ny } = sq.jitter(elapsedMs);
      const jump = updateJump(sq, elapsedMs);
      let ox = x, oy = y;
      if (jump > 0) {
        const dx = x - EMBLEM_CENTER.x, dy = y - EMBLEM_CENTER.y;
        const d = Math.hypot(dx, dy) || 1;
        ox += (dx / d) * jump;
        oy += (dy / d) * jump;
      }
      const w = 10, h = 10;
      const cx = ox - w / 2 + nx * 3;
      const cy = oy - h / 2 + ny * 3;
      sq.el.style.transform = `translate(${cx}px, ${cy}px) rotate(${angle}deg) scale(${1 + jump * 0.025})`;
    });
    placeExclaim(frac, elapsedMs);
  }

  // --- Resettable trigger: see Follow's alert for why this needs to be able
  //     to play, fully reset, and play again, not just once on page load. ---
  let cancelTimeline = null;

  function resetVisualState() {
    root.classList.remove('fading');
    const textBlock = document.getElementById('textBlock');
    textBlock.classList.remove('show');
    void textBlock.offsetWidth; // force a reflow so re-adding 'show' restarts the pop-in animation
    textBlock.classList.add('show');
    lastFrameIdx = -1;
    lastExclaimFrame = -1;
    squares.forEach(sq => {
      sq.jumping = false;
      sq.jumpStart = 0;
      sq.jumpDur = 0;
      sq.nextJumpAt = 300 + Math.random() * 700;
    });
  }

  function playAlert(username) {
    if (cancelTimeline) cancelTimeline();
    resetVisualState();
    document.getElementById('username').textContent = username || 'Viewer';

    const sfx = document.getElementById('sfx');
    sfx.volume = 0.85;
    sfx.currentTime = 0;
    sfx.play().catch(() => {}); // autoplay can be blocked outside OBS; fails silently there

    const TOTAL = 6000;
    cancelTimeline = runTimeline(TOTAL, (t, elapsed) => {
      const loopFrac = (elapsed / LOOP_DURATION) % 1;
      render(loopFrac, elapsed);
      if (t > 0.88 && !root.classList.contains('fading')) {
        root.classList.add('fading');
      }
    });
  }

  const debugFrac = params.get('frac');
  if (params.get('debug') === '1' && debugFrac !== null) {
    document.getElementById('textBlock').style.animation = 'none';
    document.getElementById('textBlock').style.opacity = '1';
    const targetMs = parseFloat(params.get('ms') || '0');
    for (let t = 0; t <= targetMs; t += 16) render(parseFloat(debugFrac), t);
    render(parseFloat(debugFrac), targetMs);
  } else {
    // Live on StreamElements: sit idle and wait for a real raid event.
    window.addEventListener('onEventReceived', (obj) => {
      if (obj.detail.listener === 'raid-latest') {
        playAlert(obj.detail.event.name);
      }
    });

    const urlUser = params.get('user');
    if (urlUser) playAlert(urlUser);

    if (params.get('simtest') === '1') {
      playAlert('FirstTester');
      setTimeout(() => {
        window.dispatchEvent(new CustomEvent('onEventReceived', {
          detail: { listener: 'raid-latest', event: { name: 'SecondTester' } },
        }));
      }, 6500);
    }
  }

</script>
</body></html>
